name: Testing and deployment

on:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ${{ secrets.SECRET }}
      DEBUG: ${{ secrets.DEBUG_MODE }}
      ALLOWED: ${{ secrets.ALLOWED_HOSTS }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_USER: ${{ secrets.DB_USER }}
    services:
      postgresql_main:
        image: postgres:12
        env:
          POSTGRES_DB: ${{ secrets.DB_NAME }}
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options:
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Проверяем на наличие изменений
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run flake8
        run: flake8 logistic/ --exclude=logistic/migrations/ --ignore=W292,W293,W391

      - name: Миграции базы данных
        run: |
          python manage.py migrate
        env:
          SECRET_KEY: ${{ secrets.SECRET }}
          DEBUG: ${{ secrets.DEBUG_MODE }}
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
          DB_HOST: localhost  # Переопределяем для локального сервиса PostgreSQL
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}

      - name: Collect static files
        run: |
          python manage.py collectstatic --noinput
        env:
          SECRET_KEY: ${{ secrets.SECRET }}
          DEBUG: ${{ secrets.DEBUG_MODE }}
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
          DB_HOST: localhost  # Переопределяем для локального сервиса PostgreSQL
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}

      - name: Тестирование
        run: |
          python manage.py test
        env:
          SECRET_KEY: ${{ secrets.SECRET }}
          DEBUG: ${{ secrets.DEBUG_MODE }}
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
          DB_HOST: localhost  # Переопределяем для локального сервиса PostgreSQL
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}




